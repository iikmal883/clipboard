<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ikmal Tech Quick Clipboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        /* Animasi Gradient Bergerak untuk Tajuk */
        @keyframes colorShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .neon-title {
            background: linear-gradient(270deg, #ff2a8d, #ff758c, #ffeb3b, #ff2a8d);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorShift 4s ease infinite;
        }

        /* Animasi Jiggle */
        @keyframes jiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-1.5deg) scale(1.02); }
            75% { transform: rotate(1.5deg) scale(0.98); }
        }

        .animate-jiggle {
            display: inline-block;
            animation: jiggle 0.6s ease-in-out infinite;
        }

        /* Background Glitchy 50% Opacity */
        .glitch-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255, 42, 141, 0.15) 0%, rgba(15, 15, 25, 0.95) 80%);
            opacity: 0.5;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .glitch-bg::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 1;
        }

        .print-logo {
            width: 38px;
            height: 38px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 42, 141, 0.6));
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col relative">

    <!-- Background Glitchy Layer -->
    <div class="glitch-bg"></div>

    <!-- Header -->
    <header class="bg-slate-900/90 border-b border-pink-500/30 p-4 sticky top-0 z-10 backdrop-blur-md shadow-lg shadow-pink-950/40">
        <div class="max-w-md mx-auto space-y-3">
            <!-- Top Navigation / Cashflow Button -->
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2.5">
                    <img src="https://i.ibb.co/xSrJcPQp/transparent-malt.png" alt="Ikmal Tech Solution Logo" class="print-logo">
                    <div>
                        <h1 class="text-sm font-extrabold tracking-wide neon-title animate-jiggle">Ikmal Tech Solution</h1>
                        <p class="text-[10px] text-pink-300/80">Live Cloud Clipboard</p>
                    </div>
                </div>
                
                <!-- Button ke Cashflow Dashboard -->
                <a href="https://iikmal883.github.io/malt-cashflow/" class="bg-pink-600/20 hover:bg-pink-600 text-pink-300 hover:text-white border border-pink-500/40 text-xs font-semibold px-3 py-1.5 rounded-lg transition active:scale-95 shadow-sm">
                    📊 Cashflow
                </a>
            </div>
            
            <div class="flex justify-between items-center text-xs pt-1 border-t border-pink-500/10">
                <span class="text-slate-400">Status Sistem:</span>
                <span id="syncStatus" class="bg-pink-950 text-pink-300 text-[11px] px-2.5 py-0.5 rounded-full font-medium border border-pink-700/50">Syncing...</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4 pb-20">

        <!-- Toast Notification -->
        <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-pink-600 text-white text-sm px-4 py-2 rounded-full shadow-lg shadow-pink-900/50 opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="toast-text">Berjaya disalin!</span>
        </div>

        <!-- Add New Snippet Form -->
        <div class="bg-slate-900/80 border border-pink-500/30 rounded-xl p-4 shadow-lg shadow-pink-950/20 space-y-3 backdrop-blur-sm">
            <h2 class="text-sm font-semibold text-pink-300">Tambah Quick Text Baru</h2>
            <div class="space-y-2">
                <textarea id="snippetInput" rows="2" placeholder="Taip atau paste teks cepat di sini..." class="w-full bg-slate-950 border border-pink-500/30 rounded-lg p-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-pink-500 resize-none"></textarea>
                
                <div class="flex space-x-2">
                    <button onclick="pasteFromClipboard()" class="flex-1 bg-slate-800 hover:bg-slate-700 active:scale-[0.98] transition text-pink-300 font-medium text-xs py-2.5 rounded-lg shadow-sm border border-pink-500/30">
                        📋 Ambil dari Clipboard
                    </button>
                    <button onclick="addSnippet()" id="saveBtn" class="flex-1 bg-pink-600 hover:bg-pink-500 active:scale-[0.98] transition text-white font-medium text-xs py-2.5 rounded-lg shadow-sm shadow-pink-600/30">
                        Simpan ke Cloud
                    </button>
                </div>
            </div>
        </div>

        <!-- Snippets List Section -->
        <div class="space-y-2">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-pink-400">Cloud Snippets</h2>
                <span id="countBadge" class="text-xs text-slate-400">0 items</span>
            </div>
            
            <div id="snippetsList" class="space-y-2.5">
                <div class="text-center py-8 text-slate-500 text-sm">Memuatkan data dari Google Sheets...</div>
            </div>
        </div>

    </main>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwedgtVkOfsUy1jVCQNW5CEzPNedE9ECPT4jtXPyHN9d429EbnhgD09C6dttkUkEsk--w/exec";

        let snippets = [];
        let expandedItems = new Set();

        async function fetchSnippets() {
            const statusBadge = document.getElementById('syncStatus');
            statusBadge.innerText = "Syncing...";
            try {
                const response = await fetch(WEB_APP_URL);
                snippets = await response.json();
                renderSnippets();
                statusBadge.innerText = "Online Live";
            } catch (err) {
                console.error("Gagal ambil data:", err);
                statusBadge.innerText = "Offline Mode";
            }
        }

        function renderSnippets() {
            const listContainer = document.getElementById('snippetsList');
            const countBadge = document.getElementById('countBadge');
            listContainer.innerHTML = '';
            countBadge.innerText = `${snippets.length} items`;

            if (snippets.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Tiada snippet tersimpan lagi.</div>`;
                return;
            }

            const reversedSnippets = [...snippets].reverse();

            reversedSnippets.forEach((text, originalIndex) => {
                const actualIndex = snippets.length - 1 - originalIndex;
                const isExpanded = expandedItems.has(actualIndex);

                const card = document.createElement('div');
                card.className = "bg-slate-900/80 border border-pink-500/20 rounded-xl p-3.5 space-y-2 shadow-sm hover:border-pink-500/50 transition backdrop-blur-sm";
                
                const topRow = document.createElement('div');
                topRow.className = "flex items-start justify-between space-x-3";

                const textDiv = document.createElement('div');
                textDiv.className = `flex-1 text-sm text-slate-200 break-words leading-relaxed ${isExpanded ? '' : 'line-clamp-3'}`;
                textDiv.textContent = text;

                const actionDiv = document.createElement('div');
                actionDiv.className = "flex items-center space-x-1.5 shrink-0";

                const copyBtn = document.createElement('button');
                copyBtn.className = "bg-pink-600/20 hover:bg-pink-600 text-pink-300 hover:text-white border border-pink-500/30 text-xs font-medium px-2.5 py-1.5 rounded-lg transition active:scale-95";
                copyBtn.innerText = "Copy";
                copyBtn.onclick = () => copySnippet(text);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = "text-slate-500 hover:text-pink-400 p-1.5 transition";
                deleteBtn.title = "Padam";
                deleteBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
                deleteBtn.onclick = () => deleteSnippet(actualIndex, text);

                actionDiv.appendChild(copyBtn);
                actionDiv.appendChild(deleteBtn);
                topRow.appendChild(textDiv);
                topRow.appendChild(actionDiv);

                const bottomRow = document.createElement('div');
                bottomRow.className = "flex justify-between items-center pt-1 border-t border-pink-500/10";

                const expandBtn = document.createElement('button');
                expandBtn.className = "text-xs text-pink-400 hover:text-pink-300 font-medium transition flex items-center space-x-1";
                expandBtn.innerText = isExpanded ? '▲ Tutup (Tunjuk Sikit)' : '▼ Lihat Penuh';
                expandBtn.onclick = () => toggleExpand(actualIndex);

                bottomRow.appendChild(expandBtn);

                card.appendChild(topRow);
                card.appendChild(bottomRow);
                listContainer.appendChild(card);
            });
        }

        function toggleExpand(index) {
            if (expandedItems.has(index)) {
                expandedItems.delete(index);
            } else {
                expandedItems.add(index);
            }
            renderSnippets();
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('snippetInput').value = text;
                }
            } catch (err) {
                alert('Sila tap lama-lama pada ruang teks di atas dan pilih "Paste".');
            }
        }

        async function addSnippet() {
            const input = document.getElementById('snippetInput');
            const text = input.value.trim();
            if (!text) return;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Menyimpan...";
            saveBtn.disabled = true;

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "save", text: text })
                });

                input.value = '';
                setTimeout(fetchSnippets, 1500);
            } catch (err) {
                alert("Gagal simpan ke cloud.");
            } finally {
                saveBtn.innerText = "Simpan ke Cloud";
                saveBtn.disabled = false;
            }
        }

        async function deleteSnippet(index, text) {
            const confirmDelete = confirm("Adakah Ikmal pasti mahu memadam snippet ini dari Cloud?");
            if (!confirmDelete) return;

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "delete", text: text })
                });

                setTimeout(fetchSnippets, 1500);
            } catch (err) {
                alert("Gagal padam.");
            }
        }

        function copySnippet(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(showToast);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast();
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 1500);
        }

        fetchSnippets();
    </script>
</body>
</html>
